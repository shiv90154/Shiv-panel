# Failed SMTP AUTH attempts (submission 587 / smtps 465 / smtp 25) from the Postfix log written by the mail container.
# Self-contained on purpose (no `before = common.conf`): the mail container writes ISO-8601 timestamps through Postfix's `maillog_file`.
[Definition]
failregex = ^.*postfix/[\w/-]*smtpd\[\d+\]: warning: [^\[\]]*\[<HOST>\]: SASL [\w-]+ authentication failed
ignoreregex =
