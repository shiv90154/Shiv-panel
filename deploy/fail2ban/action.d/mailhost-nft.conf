# Ban through the panel's own nft table (`inet mailhost_ban`, prerouting hook), so bans also cover the mail ports that Docker publishes.
# The helper lives in the agent checkout: /opt/mailhost/agent/banlist.mjs (see DECISIONS #23). It validates the address again.
[Definition]
actionstart = /usr/bin/node /opt/mailhost/agent/banlist.mjs start
actionstop  = /usr/bin/node /opt/mailhost/agent/banlist.mjs stop
actioncheck =
actionban   = /usr/bin/node /opt/mailhost/agent/banlist.mjs ban <ip> <bantime>
actionunban = /usr/bin/node /opt/mailhost/agent/banlist.mjs unban <ip>

[Init]
