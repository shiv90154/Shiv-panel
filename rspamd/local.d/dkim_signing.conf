# Keys are generated by the admin app: /var/lib/rspamd/dkim/<domain>.<selector>.key
enabled = true;
sign_authenticated = true;
sign_local = true;
sign_inbound = false;
use_domain = "header";
use_esld = false;
try_fallback = false;
allow_username_mismatch = true;
path = "/var/lib/rspamd/dkim/$domain.$selector.key";
selector_map = "/var/lib/rspamd/dkim/selectors.map";
